# Render Blueprint — 이 파일이 있으면 Render 가 설정을 자동으로 읽는다.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gimbap-hell
    runtime: node
    plan: free
    region: singapore          # 한국에서 가장 가까운 무료 리전
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health   # server/index.mjs 가 이미 제공하는 엔드포인트
    autoDeploy: true           # main 에 푸시하면 자동 재배포
    envVars:
      - key: NODE_VERSION
        value: "20.20.2"

      # 가게 랭킹 저장소 — 무료 플랜은 파일 시스템이 휘발성이라 Upstash 에 둔다.
      # sync: false 는 "값을 blueprint 에 적지 말고 대시보드에서 받아라" 라는 뜻.
      # 둘 다 비워두면 서버는 파일 모드로 돌아가고, 잠들 때마다 랭킹이 초기화된다.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
