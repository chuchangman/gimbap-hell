# 테스트를 통과해야 배포된다.
#
# render.yaml 의 autoDeploy 가 false 라서 푸시만으로는 배포가 안 나간다.
# 아래 deploy 잡이 RENDER_DEPLOY_HOOK 을 호출해야 비로소 배포된다.
# verify 잡이 깨지면 needs 때문에 deploy 잡은 아예 실행되지 않는다.
#
# 되돌리려면 render.yaml 의 autoDeploy 를 true 로 하면 된다
# (그때는 이 워크플로가 알림 역할만 한다).
#
# 브라우저 QA(`npm run qa:browser`)는 여기서 돌리지 않는다 — 실제 Chrome 과
# Playwright 가 필요한 로컬 전용 도구다. 릴리스 전에 손으로 돌린다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # package.json 의 engines 와 같아야 한다 (test/release-config.test.mjs 가 확인한다)
  NODE_VERSION: '22.12.0'

jobs:
  verify:
    name: 검증 — 빌드 · 타입 · 린트 · 서식 · 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # 워크스페이스 빌드가 먼저다 — 서버 통합 테스트가 dist 를, 정적 서빙
      # 테스트가 apps/client/dist 를 읽는다.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # 레거시 스모크·동등성(root) + 서버·클라이언트(turbo)
      - run: npm run verify

  redis-test:
    name: 실제 Redis 저장 회귀 테스트
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:redis
        env:
          REDIS_TEST_PORT: ${{ job.services.redis.ports[6379] }}

  deploy:
    name: Render 배포
    needs: [verify, redis-test] # 실제 Redis 회귀 테스트도 통과해야 배포한다
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Render 배포 훅 호출
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK 시크릿이 없습니다. autoDeploy 도 꺼져 있어 배포가 안 나갑니다."
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "배포를 요청했습니다."
