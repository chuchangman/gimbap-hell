# 테스트를 통과해야 배포된다.
#
# render.yaml 의 autoDeploy 가 false 라서 푸시만으로는 배포가 안 나간다.
# 아래 deploy 잡이 RENDER_DEPLOY_HOOK 을 호출해야 비로소 배포된다.
# test 잡이 깨지면 needs 때문에 deploy 잡은 아예 실행되지 않는다.
#
# 되돌리려면 render.yaml 의 autoDeploy 를 true 로 하면 된다
# (그때는 이 워크플로가 알림 역할만 한다).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 스모크 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: Render 배포
    needs: test                    # 테스트가 깨지면 여기까지 안 온다
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Render 배포 훅 호출
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK 시크릿이 없습니다. autoDeploy 도 꺼져 있어 배포가 안 나갑니다."
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "배포를 요청했습니다."
